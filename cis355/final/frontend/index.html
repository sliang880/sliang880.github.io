<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fitness Club Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="logo-section">
        <h1 class="logo-title">Fitness Club Admin</h1>
        <p class="logo-subtitle">Management Panel</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginField">Username or Email</label>
          <input type="text" id="loginField" placeholder="Enter username or email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <p id="errorMsg" class="message error-msg"></p>

      <div class="auth-link">
        Don't have an account? <a href="register.html">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>

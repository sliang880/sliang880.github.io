<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2457e6" />
    <meta name="description" content="Your weather-aware daily schedule." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://api.open-meteo.com" />
    <title>Weather Schedule</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <h1>My Schedule</h1>
          <p id="date-label" class="date-label">Loading today…</p>
          <p id="summary" class="summary">Finding your local forecast…</p>
          <p id="location-label" class="location-label">Location: —</p>
        </div>
        <button id="settings-button" class="icon-button" aria-label="Show settings">⚙</button>
      </header>

      <section id="settings-panel" class="settings-panel" hidden aria-label="Settings">
        <h2>Settings</h2>
        <div class="setting-row">
          <label for="location-input">ZIP or city:</label>
          <input id="location-input" placeholder="Bay City, MI" autocomplete="address-level2" />
          <button id="save-location" class="button button-small">Change</button>
        </div>
        <div class="setting-row">
          <label for="calendar-id-input">Public Google Calendar ID:</label>
          <input id="calendar-id-input" placeholder="name@gmail.com or …@group.calendar.google.com" />
          <button id="connect-calendar" class="button button-small">Connect</button>
        </div>
        <div class="setting-note">For a private calendar, connect with Google below.</div>
        <div class="setting-row private-calendar">
          <label for="google-client-id">Google OAuth Client ID:</label>
          <input id="google-client-id" placeholder="12345…apps.googleusercontent.com" />
          <button id="private-calendar-button" class="button button-small">Sign in</button>
        </div>
        <p id="settings-status" class="settings-status"></p>
      </section>

      <section class="schedule-card" aria-label="Daily schedule">
        <div class="table-head" aria-hidden="true">
          <span>Time</span><span>Weather</span><span>Calendar</span>
        </div>
        <div id="schedule" class="schedule" aria-live="polite"></div>
      </section>
    </main>

    <template id="loading-template">
      <div class="empty-state"><span class="spinner"></span> Building your schedule…</div>
    </template>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
